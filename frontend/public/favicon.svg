<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fundo azul profundo com cantos arredondados -->
  <rect width="64" height="64" rx="12" fill="#1e3a5f"/>
  
  <!-- Círculo âmbar de destaque (atrás das letras) -->
  <circle cx="32" cy="32" r="22" fill="#e8a838" opacity="0.15"/>
  
  <!-- Letras "CC" estilizadas -->
  <g font-family="Georgia, serif" font-weight="700" fill="#faf8f5">
    <!-- Primeiro C -->
    <text x="14" y="44" font-size="32" letter-spacing="-2">C</text>
    <!-- Segundo C (levemente deslocado) -->
    <text x="32" y="44" font-size="32" letter-spacing="-2" fill="#e8a838">C</text>
  </g>
  
  <!-- Detalhe: linha âmbar sutil na base -->
  <rect x="12" y="52" width="40" height="2" rx="1" fill="#e8a838" opacity="0.6"/>
</svg>